apiVersion: v1
kind: ResourceQuota
metadata:
  name: fabricx-quota
  namespace: fabricx-dev
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "16"
    limits.memory: 16Gi
    persistentvolumeclaims: "20"
    requests.storage: 40Gi

---
apiVersion: v1
kind: LimitRange
metadata:
  name: fabricx-limit-range
  namespace: fabricx-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 4Gi
